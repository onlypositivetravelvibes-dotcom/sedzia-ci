name: Sedzia CI M14

on:
  workflow_dispatch:
    inputs:
      dzialanie:
        description: "kolejka = wykonaj zlecenia z lustra (domyslne); klucz/pomiar/efekt = reczny bieg"
        required: true
        default: kolejka
        type: choice
        options:
          - kolejka
          - klucz
          - pomiar
          - efekt
      runner:
        description: "braun | astra (tylko bieg reczny)"
        required: false
        default: braun
      phase:
        description: "BEFORE, SHADOW albo AFTER (pomiar)"
        required: false
        default: BEFORE
      statement_id:
        description: "id statementu (pomiar/efekt)"
        required: false
        default: ""
      solver_path:
        description: "pomiar: sciezka artefaktu na galezi astra"
        required: false
        default: od_brauna/2026-09-15__M14-E24-wejscie/bajty/gen_sekwencje_R0.py
      before_id:
        description: "efekt: id koperty BEFORE"
        required: false
        default: ""
      after_id:
        description: "efekt: id koperty AFTER"
        required: false
        default: ""
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: sedzia-ci
  cancel-in-progress: false

jobs:
  sedzia:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: zaleznosci
        run: pip install --quiet cryptography
      - name: "lustro (galaz astra - skrypt, kolejka, wejscia)"
        env:
          LUSTRO_TOKEN: ${{ secrets.LUSTRO_TOKEN }}
        run: |
          echo "LUSTRO_TOKEN dlugosc=${#LUSTRO_TOKEN} (0 = sekret nie dotarl)"
          git -c "http.https://github.com/.extraheader=" fetch "https://x-access-token:${LUSTRO_TOKEN}@github.com/braun-systems/KDP-lustro" astra:refs/remotes/origin/astra
          git show origin/astra:od_brauna/sedzia_ci/sedzia_ci.py > sedzia_ci_z_lustra.py
          echo "skrypt z lustra sha256: $(sha256sum sedzia_ci_z_lustra.py | cut -c1-16) @ $(git rev-parse --short origin/astra)"
      - name: sedzia
        env:
          SEDZIA_HASLO: ${{ secrets.SEDZIA_HASLO }}
          SEDZIA_HASLO_ASTRA: ${{ secrets.SEDZIA_HASLO_ASTRA }}
          SEDZIA_SKRYPT_PATH: sedzia_ci_z_lustra.py
          RUNNER: ${{ inputs.runner || 'braun' }}
          DZIALANIE: ${{ inputs.dzialanie || 'kolejka' }}
          PHASE: ${{ inputs.phase }}
          STATEMENT_ID: ${{ inputs.statement_id }}
          SOLVER_PATH: ${{ inputs.solver_path }}
          BEFORE_ID: ${{ inputs.before_id }}
          AFTER_ID: ${{ inputs.after_id }}
          RUN_ID: ${{ github.run_id }}
        run: python3 sedzia_ci_z_lustra.py
      - name: zapisz wynik do repo
        run: |
          git config user.name "sedzia-ci"
          git config user.email "sedzia-ci@users.noreply.github.com"
          git add sedzia_ci/
          git commit -q -m "sedzia-ci: ${{ inputs.dzialanie || 'kolejka' }} (run ${{ github.run_id }})" || echo "nic do zapisania"
          git push || echo "push pominiety"
